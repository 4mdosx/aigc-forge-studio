<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color: #241f1a;
        background: #efe7da;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        line-height: 1.45;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 0.75rem; width: 300px; }
      h1 {
        font-size: 0.95rem;
        margin: 0 0 0.6rem;
        font-weight: 600;
      }
      button {
        font: inherit;
        width: 100%;
        border-radius: 8px;
        padding: 0.45rem 0.6rem;
        border: 0;
        background: #0c5c49;
        color: #f7f3ea;
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      #link, #status {
        margin: 0;
        font-size: 0.75rem;
        color: #746c63;
        overflow-wrap: anywhere;
      }
      #link { margin-bottom: 0.55rem; }
      #status { margin-top: 0.55rem; }
      #status.error { color: #a04030; }
      #status.ok { color: #0c5c49; }
    </style>
  </head>
  <body>
    <h1>采集此页</h1>
    <p id="link">正在连接…</p>
    <button id="grab" disabled>采集</button>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
